
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI MOTION LAB</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px;
  background: #080f20;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #38bdf8; letter-spacing: 4px; }
p { color: #94a3b8; }
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  max-width: 1200px;
  margin: 25px auto;
}
.panel {
  background: #111c30;
  border: 1px solid #334155;
  border-radius: 16px;
  padding: 15px;
  min-width: 0;
}
canvas { width: 100%; display: block; border-radius: 10px; }
#robot { height: 400px; overflow: hidden; }
button {
  padding: 15px 25px;
  border: none;
  border-radius: 10px;
  background: #38bdf8;
  color: #081020;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: 0.5; }
#status { margin: 18px; color: #4ade80; }
@media(max-width: 700px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<h1>AI MOTION LAB</h1>
<p>인공지능 기반 실시간 모션 미러 로봇</p>

<button id="start">카메라 시작</button>
<button id="stop" disabled>종료</button>
<div id="status">카메라 시작 버튼을 눌러주세요.</div>

<div class="container">
  <section class="panel">
    <h3>AI 신체 인식</h3>
    <video id="video" autoplay playsinline muted hidden></video>
    <canvas id="camera" width="640" height="480"></canvas>
  </section>
  <section class="panel">
    <h3>3D MOTION ROBOT</h3>
    <div id="robot"></div>
  </section>
</div>

<script type="module">

const video = document.getElementById("video");
const canvas = document.getElementById("camera");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const start = document.getElementById("start");
const stop = document.getElementById("stop");

let pose, stream, running = false;
let scene, camera, renderer, THREE;
let parts = [], joints = [], head;
let lastTime = -1, frameId;

const links = [
  [11,12], [11,13], [13,15],
  [12,14], [14,16], [11,23],
  [12,24], [23,24], [23,25],
  [25,27], [24,26], [26,28]
];

async function initAI() {
  const {FilesetResolver, PoseLandmarker} =
    await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  pose = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
}

async function initRobot() {
  THREE = await import(
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  );

  const box = document.getElementById("robot");
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1425);

  camera = new THREE.PerspectiveCamera(
    40, box.clientWidth / 400, 0.1, 100
  );
  camera.position.set(0, 0.2, 4);
  camera.lookAt(0, 0.15, 0);

  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(box.clientWidth, 400);
  box.appendChild(renderer.domElement);

  window.addEventListener("resize", () => {
    camera.aspect = box.clientWidth / 400;
    camera.updateProjectionMatrix();
    renderer.setSize(box.clientWidth, 400);
  });

  scene.add(new THREE.AmbientLight(0xffffff, 1.5));
  const light = new THREE.DirectionalLight(0xffffff, 3);
  light.position.set(3, 5, 4);
  scene.add(light);

  const grid = new THREE.GridHelper(5, 20, 0x38bdf8, 0x24364b);
  grid.position.y = -1.1;
  scene.add(grid);

  const metal = new THREE.MeshStandardMaterial({
    color: 0x9cddff, metalness: 0.5, roughness: 0.3
  });

  const blue = new THREE.MeshStandardMaterial({
    color: 0x38bdf8, emissive: 0x005577
  });

  links.forEach(() => {
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.045, 1, 12),
      metal
    );
    mesh.visible = false;
    scene.add(mesh);
    parts.push(mesh);
  });

  for (let i = 0; i < 33; i++) {
    const joint = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 12, 12), blue
    );
    joint.visible = false;
    scene.add(joint);
    joints.push(joint);
  }

  head = new THREE.Mesh(
    new THREE.BoxGeometry(0.23, 0.25, 0.20), metal
  );
  head.visible = false;
  scene.add(head);
  renderer.render(scene, camera);
}

function drawCamera(points) {
  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (points) {
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 4;

    links.forEach(([a,b]) => {
      if (points[a].visibility < 0.5 ||
          points[b].visibility < 0.5) return;
      ctx.beginPath();
      ctx.moveTo(points[a].x * canvas.width,
                 points[a].y * canvas.height);
      ctx.lineTo(points[b].x * canvas.width,
                 points[b].y * canvas.height);
      ctx.stroke();
    });

    ctx.fillStyle = "#4ade80";
    points.forEach(p => {
      if (p.visibility < 0.5) return;
      ctx.beginPath();
      ctx.arc(p.x * canvas.width,
              p.y * canvas.height, 5, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  ctx.restore();
}

function drawRobot(points) {
  if (!points) {
    [...parts, ...joints, head].forEach(m => m.visible = false);
    renderer.render(scene, camera);
    return;
  }

  const vectors = points.map(p =>
    new THREE.Vector3(-p.x * 1.6, -p.y * 1.6, -p.z * 1.6)
  );

  joints.forEach((joint, i) => {
    joint.visible = i >= 11 && points[i].visibility >= 0.5;
    joint.position.copy(vectors[i]);
  });

  links.forEach(([a,b], i) => {
    const mesh = parts[i];
    const direction = new THREE.Vector3()
      .subVectors(vectors[b], vectors[a]);

    mesh.visible =
      points[a].visibility >= 0.5 &&
      points[b].visibility >= 0.5 &&
      direction.length() > 0.001;

    if (!mesh.visible) return;

    mesh.position.copy(vectors[a])
      .add(vectors[b]).multiplyScalar(0.5);

    mesh.scale.y = direction.length();

    mesh.quaternion.setFromUnitVectors(
      new THREE.Vector3(0,1,0), direction.normalize()
    );
  });

  head.visible = points[0].visibility >= 0.5;
  head.position.copy(vectors[0]);

  renderer.render(scene, camera);
}

function loop() {
  if (!running) return;

  try {
    if (video.readyState >= 2 &&
        video.currentTime !== lastTime) {

      lastTime = video.currentTime;

      const result = pose.detectForVideo(
        video, performance.now()
      );

      drawCamera(result.landmarks[0]);
      drawRobot(result.worldLandmarks[0]);

      status.textContent = result.landmarks.length
        ? "AI 신체 인식 중!"
        : "카메라 안에 몸이 보이도록 움직여 주세요.";
    }
    frameId = requestAnimationFrame(loop);
  } catch (error) {
    stopCamera();
    status.textContent = "인식 오류: " + error.message;
  }
}

function stopCamera() {
  running = false;
  cancelAnimationFrame(frameId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (renderer) drawRobot(null);
  start.disabled = false;
  stop.disabled = true;
  status.textContent = "카메라가 종료되었습니다.";
}

start.onclick = async () => {
  start.disabled = true;
  try {
    status.textContent = "AI 모델을 불러오는 중...";
    if (!pose) await initAI();
    if (!renderer) await initRobot();

    status.textContent = "카메라 연결 중...";
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: {ideal: 640},
        height: {ideal: 480},
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    lastTime = -1;
    running = true;
    stop.disabled = false;
    loop();
  } catch (error) {
    stopCamera();
    status.textContent = "실행 오류: " + error.message;
  }
};

stop.onclick = stopCamera;

</script>
</body>
</html>
